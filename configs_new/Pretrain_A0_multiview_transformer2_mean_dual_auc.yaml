# Two-layer Transformer mean-pooling ablation for original/lung/heart ALBEF fusion.
# batch_size is PER GPU. With 2 A40s under DDP, 32/GPU gives global batch 64.
# The only intended architectural difference from the FC fusion experiment is
# the view-fusion module: 2-layer TransformerEncoder + mean pooling.

lung_train_file:
- data/chexmask_manifests/mimic_cxr_chexmask_common_valid_lung_maskcache.json
heart_train_file:
- data/chexmask_manifests/mimic_cxr_chexmask_common_valid_heart_maskcache.json
lung_mask_root: /home/woody/iwi5/iwi5362h/data/chexmask/mask_cache/common/lung
heart_mask_root: /home/woody/iwi5/iwi5362h/data/chexmask/mask_cache/common/heart
image_key: image
caption_key: caption
mask_key: mask_relpath
view_name: multiview_transformer2_mean_fusion
initial_checkpoints:
  original: /home/vault/iwi5/iwi5362h/outputs/A0_original_dual_auc/checkpoint_best_macro_auc_stable.pth
  lung: /home/vault/iwi5/iwi5362h/outputs/A0_lung_dual_auc/checkpoint_best_macro_auc_stable.pth
  heart: /home/vault/iwi5/iwi5362h/outputs/A0_heart_dual_auc/checkpoint_best_macro_auc_stable.pth
  shared_components_from: original
bert_config: configs/config_bert.json
text_encoder: bert-base-uncased
image_res: 256
vision_width: 768
embed_dim: 256
batch_size: 32
num_workers: 8
temp: 0.07
mlm_probability: 0.15
queue_size: 65536
momentum: 0.995
alpha: 0.4
max_words: 30
max_text_len: 32
optimizer:
  opt: adamW
  lr: 1e-4
  weight_decay: 0.02
schedular:
  sched: cosine
  lr: 1e-4
  epochs: 30
  min_lr: 1e-5
  decay_rate: 1
  warmup_lr: 1e-5
  warmup_epochs: 10
  cooldown_epochs: 0
cxr_augmentation:
  enabled: true
  rotation_degrees: 5.0
  translate_fraction: 0.02
  scale_min: 0.98
  scale_max: 1.02
  brightness: 0.1
  contrast: 0.1
  photometric_probability: 0.5
train_subset_size: null
train_subset_seed: 42
print_freq: 50
grad_clip_norm: null
debug_max_batches: null
cudnn_deterministic: true
verify_training_files_at_start: false
retain_last_checkpoint_after_success: false
vindr_validation:
  enabled: true
  validate_every: 1
  labels_csv: /home/woody/iwi5/iwi5362h/data/vindr_cxr/annotations/checkpoint_validation_2000/multilabel_labels.csv
  images_root: /home/woody/iwi5/iwi5362h/data/vindr_cxr/train
  lung_mask_root: /home/woody/iwi5/iwi5362h/data/vindr_cxr/chexmask_mask_cache/train/lung
  heart_mask_root: /home/woody/iwi5/iwi5362h/data/vindr_cxr/chexmask_mask_cache/train/heart
  label_name: Cardiomegaly
  batch_size: 32
  num_workers: 8
  max_images: null
  max_text_length: 32
  threshold_steps: 200
  macro_auc_labels:
  - Aortic enlargement
  - Calcification
  - Cardiomegaly
  - ILD
  - Infiltration
  - Lung Opacity
  - Nodule/Mass
  - Pleural effusion
  - Pleural thickening
  - Pulmonary fibrosis
  - Other lesion
  - Pneumonia
  - Tuberculosis
  - Other diseases
  - No finding
  min_positive_per_label: 20
  min_negative_per_label: 20
  cardiomegaly_min_delta: 0.0005
  macro_min_delta: 0.0005
  early_stopping:
    enabled: true
    min_epochs: 15
    patience: 5
view_fusion_transformer:
  num_layers: 2
  num_heads: 12
  mlp_ratio: 4.0
  dropout: 0.0
  pooling: mean
enable_finite_checks: false
numeric_debug_every: 100
