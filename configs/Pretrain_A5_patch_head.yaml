# A5: identity-initialized patch prediction head from detached ALBEF attention

train_file: ['data/mimic_cxr.json']

bert_config: 'configs/config_bert.json'
text_encoder: 'bert-base-uncased'

image_res: 256
vision_width: 768
embed_dim: 256
batch_size: 64
temp: 0.07
mlm_probability: 0.15
queue_size: 65536
momentum: 0.995
alpha: 0.4

optimizer: {opt: adamW, lr: 1e-4, weight_decay: 0.02}
schedular: {sched: cosine, lr: 1e-4, epochs: 30, min_lr: 1e-5, decay_rate: 1, warmup_lr: 1e-5, warmup_epochs: 10, cooldown_epochs: 0}

# Optional controlled-subset setting; keep null/commented for full-dataset A5.
train_subset_size: null
train_subset_seed: 42

# A5 anatomy prior settings
lambda_support: 0.01
support_mode: positive_only
anatomy_target_phrase: cardiomegaly
anatomy_layers: [8]
positive_caption_weight: 1.0
uncertain_caption_weight: 0.5

# A5 patch prediction head
patch_size: 16
patch_head_num_patches: 256
patch_head_num_layers: 2
patch_head_normalization: relu_renorm
patch_head_eps: 1e-8

# False = original ALBEF losses train ALBEF normally;
# support branch is detached and updates only patch_head.
freeze_albef_for_a5: false

print_freq: 50
# debug_max_batches: 5
