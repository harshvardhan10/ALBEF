# Bounded diagnostic only; never use as a full experiment config.
lung_train_file: null
heart_train_file: null
lung_mask_root: null
heart_mask_root: null
image_key: image
caption_key: caption
mask_key: mask_relpath
view_name: multiview_transformer2_mean_fusion
initial_checkpoints:
  original: null
  lung: null
  heart: null
  shared_components_from: original
bert_config: configs/config_bert.json
text_encoder: bert-base-uncased
image_res: 256
vision_width: 768
embed_dim: 256
batch_size: 2
num_workers: 0
temp: 0.07
mlm_probability: 0.15
queue_size: 65536
momentum: 0.995
alpha: 0.4
max_words: 30
max_text_len: 32
optimizer:
  opt: adamW
  lr: 1e-4
  weight_decay: 0.02
schedular:
  sched: cosine
  lr: 1e-4
  epochs: 1
  min_lr: 1e-5
  decay_rate: 1
  warmup_lr: 1e-5
  warmup_epochs: 10
  cooldown_epochs: 0
cxr_augmentation:
  enabled: true
  rotation_degrees: 5.0
  translate_fraction: 0.02
  scale_min: 0.98
  scale_max: 1.02
  brightness: 0.1
  contrast: 0.1
  photometric_probability: 0.5
train_subset_size: 8
train_subset_seed: 42
print_freq: 50
grad_clip_norm: null
debug_max_batches: 2
cudnn_deterministic: true
verify_training_files_at_start: false
retain_last_checkpoint_after_success: true
vindr_validation:
  enabled: false
  validate_every: 1
  labels_csv: null
  images_root: null
  lung_mask_root: null
  heart_mask_root: null
  label_name: Cardiomegaly
  batch_size: 32
  num_workers: 8
  max_images: null
  max_text_length: 32
  threshold_steps: 200
  macro_auc_labels:
  - Aortic enlargement
  - Calcification
  - Cardiomegaly
  - ILD
  - Infiltration
  - Lung Opacity
  - Nodule/Mass
  - Pleural effusion
  - Pleural thickening
  - Pulmonary fibrosis
  - Other lesion
  - Pneumonia
  - Tuberculosis
  - Other diseases
  - No finding
  min_positive_per_label: 20
  min_negative_per_label: 20
  cardiomegaly_min_delta: 0.0005
  macro_min_delta: 0.0005
  early_stopping:
    enabled: true
    min_epochs: 15
    patience: 5
view_fusion_transformer:
  num_layers: 2
  num_heads: 12
  mlp_ratio: 4.0
  dropout: 0.0
  pooling: mean
enable_finite_checks: false
numeric_debug_every: 100
view_fusion_type: transformer
