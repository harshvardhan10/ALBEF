# Copy to cluster.local.yaml (ignored) and replace paths. Only provide fields
# needed by your experiment. These examples are deliberately not runnable.
train_file:
- /path/to/authorized/mimic_cxr.json
lung_train_file:
- /path/to/lung_manifest.json
heart_train_file:
- /path/to/heart_manifest.json
lung_mask_root: /path/to/train/lung_masks
heart_mask_root: /path/to/train/heart_masks
initial_checkpoints:
  original: /path/to/original_checkpoint.pth
  lung: /path/to/lung_checkpoint.pth
  heart: /path/to/heart_checkpoint.pth
vindr_validation:
  labels_csv: /path/to/validation_labels.csv
  images_root: /path/to/validation_images
  lung_mask_root: /path/to/validation/lung_masks
  heart_mask_root: /path/to/validation/heart_masks

# Single-view masks and A4 teacher are optional path fields when needed:
# mask_root: /path/to/single_view_masks
# classification_teacher_checkpoint: /path/to/a0_teacher.pth
