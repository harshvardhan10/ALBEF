# Same common-valid records and order as the original common A0.
train_file:
  - 'data/chexmask_manifests/mimic_cxr_chexmask_common_valid_lung_maskcache.json'

view_name: 'lung'
mask_root: '/home/vault/iwi5/iwi5362h/data/chexmask/mask_cache/common/lung'

bert_config: 'configs/config_bert.json'
text_encoder: 'bert-base-uncased'

mask_key: 'mask_relpath'

image_res: 256
vision_width: 768
embed_dim: 256
batch_size: 64
num_workers: 8

temp: 0.07
mlm_probability: 0.15
queue_size: 65536
momentum: 0.995
alpha: 0.4
max_text_len: 25

optimizer: {{opt: adamW, lr: 1e-4, weight_decay: 0.02}}
schedular:
  sched: cosine
  lr: 1e-4
  epochs: 30
  min_lr: 1e-5
  decay_rate: 1
  warmup_lr: 1e-5
  warmup_epochs: 10
  cooldown_epochs: 0

train_subset_size: null
train_subset_seed: 42
print_freq: 50
grad_clip_norm: null
debug_max_batches: null
